name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Compile Windows controller bridge
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/controller-input.ps1 -ValidateOnly
      - run: npm test
